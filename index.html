            // Simulate league match con sistema de forma
            function simulateLeagueMatch(matchId, home, away, isNeutral = false) {
                const homeElo = teamData[home];
                const awayElo = teamData[away];
                
                // Verificar bonificaciones por forma
                const homeBonus = teamStreaks[home]?.hasBonus ? 1.1 : 1.0;
                const awayBonus = teamStreaks[away]?.hasBonus ? 1.1 : 1.0;
                
                // Obtener si es campo neutral (del checkbox general o del parámetro)
                const tournamentIsNeutral = tournamentNeutralFieldCheckbox.checked;
                const finalIsNeutral = isNeutral || tournamentIsNeutral;
                
                // Simulate match usando el sistema con bonus de goles adicionales
                const eloDifference = homeElo - awayElo;
                const homeAdvantage = finalIsNeutral ? 0 : 0.15;
                const eloWeight = 0.028;
                
                // Calcular goles esperados base
                const baseHomeGoals = (1.1 + (eloDifference * eloWeight) + homeAdvantage) * homeBonus;
                const baseAwayGoals = (0.9 - (eloDifference * eloWeight)) * awayBonus;
                
                // Asegurar valores positivos
                const safeHomeGoals = Math.max(baseHomeGoals, 0.3);
                const safeAwayGoals = Math.max(baseAwayGoals, 0.3);
                
                // Aplicar distribución de Poisson para goles base
                let homeGoals = poissonRandom(safeHomeGoals);
                let awayGoals = poissonRandom(safeAwayGoals);
                
                // APLICAR BONUS DE GOLES ADICIONALES SEGÚN DIFERENCIA DE ELO
                const absEloDiff = Math.abs(eloDifference);
                let extraGoalChance = 0;
                let extraTwoGoalsChance = 0;
                
                // Determinar las probabilidades de gol extra según la diferencia de ELO
                if (absEloDiff >= 20) {
                    extraGoalChance = 0.60;
                    extraTwoGoalsChance = 0.30;
                } else if (absEloDiff >= 15) {
                    extraGoalChance = 0.30;
                    extraTwoGoalsChance = 0.15;
                } else if (absEloDiff >= 10) {
                    extraGoalChance = 0.20;
                    extraTwoGoalsChance = 0.10;
                } else if (absEloDiff >= 5) {
                    extraGoalChance = 0.10;
                    extraTwoGoalsChance = 0.05;
                }
                
                // Aplicar bonus al equipo con ventaja de ELO
                if (eloDifference > 0) {
                    const rand = Math.random();
                    if (rand < extraTwoGoalsChance) {
                        homeGoals += 2;
                    } else if (rand < extraGoalChance + extraTwoGoalsChance) {
                        homeGoals += 1;
                    }
                } else if (eloDifference < 0) {
                    const rand = Math.random();
                    if (rand < extraTwoGoalsChance) {
                        awayGoals += 2;
                    } else if (rand < extraGoalChance + extraTwoGoalsChance) {
                        awayGoals += 1;
                    }
                }
                
                // Ajuste para mantener estadísticas generales
                if (Math.abs(eloDifference) >= 20) {
                    const rand = Math.random();
                    if (homeGoals === awayGoals) {
                        if (eloDifference > 0 && rand < 0.7) {
                            homeGoals += 1;
                        } else if (eloDifference < 0 && rand < 0.7) {
                            awayGoals += 1;
                        }
                    } else if (Math.abs(homeGoals - awayGoals) === 1) {
                        if (rand < 0.1) {
                            if (homeGoals > awayGoals) {
                                awayGoals += 1;
                            } else {
                                homeGoals += 1;
                            }
                        }
                    }
                }
                
                // Limitar goles máximos
                homeGoals = Math.min(homeGoals, 7);
                awayGoals = Math.min(awayGoals, 7);
                
                // Update match result display
                document.getElementById(`result-${matchId}`).textContent = `${homeGoals} - ${awayGoals}`;
                
                // Update standings
                const standings = tournamentData.standings['Liga'];
                const homeStats = standings.find(s => s.team === home);
                const awayStats = standings.find(s => s.team === away);
                
                if (homeStats && awayStats) {
                    homeStats.played++;
                    awayStats.played++;
                    homeStats.goalsFor += homeGoals;
                    homeStats.goalsAgainst += awayGoals;
                    awayStats.goalsFor += awayGoals;
                    awayStats.goalsAgainst += homeGoals;
                    homeStats.goalDifference = homeStats.goalsFor - homeStats.goalsAgainst;
                    awayStats.goalDifference = awayStats.goalsFor - awayStats.goalsAgainst;
                    
                    // Actualizar sistema de forma
                    if (homeGoals > awayGoals) {
                        homeStats.won++;
                        homeStats.points += 3;
                        awayStats.lost++;
                        
                        // Actualizar rachas
                        updateTeamForm(home, 'W');
                        updateTeamForm(away, 'L');
                    } else if (awayGoals > homeGoals) {
                        awayStats.won++;
                        awayStats.points += 3;
                        homeStats.lost++;
                        
                        // Actualizar rachas
                        updateTeamForm(away, 'W');
                        updateTeamForm(home, 'L');
                    } else {
                        homeStats.drawn++;
                        awayStats.drawn++;
                        homeStats.points += 1;
                        awayStats.points += 1;
                        
                        // Actualizar rachas (empate rompe racha ganadora)
                        updateTeamForm(home, 'D');
                        updateTeamForm(away, 'D');
                    }
                    
                    updateStandingsTable('Liga');
                }
                
                // Store match result
                tournamentData.matchResults[matchId] = {
                    home,
                    away,
                    homeGoals,
                    awayGoals,
                    isNeutral: finalIsNeutral
                };
            }

            // Actualizar sistema de forma de los equipos
            function updateTeamForm(team, result) {
                if (!teamForm[team]) {
                    teamForm[team] = { wins: 0, lastResult: null };
                }
                if (!teamStreaks[team]) {
                    teamStreaks[team] = { currentStreak: 0, hasBonus: false };
                }
                
                // Actualizar racha actual
                if (result === 'W') {
                    teamStreaks[team].currentStreak++;
                    teamForm[team].wins++;
                } else {
                    teamStreaks[team].currentStreak = 0;
                }
                
                // Actualizar último resultado
                teamForm[team].lastResult = result;
                
                // Verificar si el equipo gana bonus (2 victorias consecutivas)
                if (teamStreaks[team].currentStreak >= 2) {
                    teamStreaks[team].hasBonus = true;
                } else {
                    teamStreaks[team].hasBonus = false;
                }
            }

            // Simulate all league matches
            function simulateAllLeagueMatches() {
                document.querySelectorAll('.simulate-match').forEach(btn => {
                    if (!btn.disabled) {
                        btn.click();
                    }
                });
            }

            // Update standings table
            function updateStandingsTable(groupName) {
                const standings = tournamentData.standings[groupName];
                if (!standings) return;
                
                // Sort standings
                standings.sort((a, b) => {
                    if (b.points !== a.points) return b.points - a.points;
                    if (b.goalDifference !== a.goalDifference) return b.goalDifference - a.goalDifference;
                    if (b.goalsFor !== a.goalsFor) return b.goalsFor - a.goalsFor;
                    
                    // Desempate por ELO
                    const teamAElo = teamData[a.team] || 0;
                    const teamBElo = teamData[b.team] || 0;
                    if (teamBElo !== teamAElo) return teamBElo - teamAElo;
                    
                    return a.team.localeCompare(b.team);
                });
                
                // Update table
                const tbody = document.getElementById('league-standings-body');
                if (!tbody) return;
                
                tbody.innerHTML = '';
                standings.forEach((teamStats, index) => {
                    const row = document.createElement('tr');
                    const isLeader = index === 0;
                    
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td><strong>${teamStats.team}</strong></td>
                        <td>${teamStats.played}</td>
                        <td>${teamStats.won}</td>
                        <td>${teamStats.drawn}</td>
                        <td>${teamStats.lost}</td>
                        <td>${teamStats.goalsFor}</td>
                        <td>${teamStats.goalsAgainst}</td>
                        <td>${teamStats.goalDifference}</td>
                        <td><strong>${teamStats.points}</strong></td>
                    `;
                    
                    if (isLeader) {
                        row.style.backgroundColor = 'var(--light-blue)';
                    }
                    
                    tbody.appendChild(row);
                });
            }

            // Simulate knockout match - MODIFICADO: Corrección de presentación
            function simulateKnockoutMatch(matchId, home, away, roundIndex, leg = null, isNeutral = false) {
                const homeElo = teamData[home];
                const awayElo = teamData[away];
                const isTwoLegs = twoLegsCheckbox.checked;
                
                // Verificar bonificaciones por forma
                const homeBonus = teamStreaks[home]?.hasBonus ? 1.1 : 1.0;
                const awayBonus = teamStreaks[away]?.hasBonus ? 1.1 : 1.0;
                
                // Obtener si es campo neutral (del checkbox general o del parámetro)
                const tournamentIsNeutral = tournamentNeutralFieldCheckbox.checked;
                const finalIsNeutral = isNeutral || tournamentIsNeutral;
                
                if (isTwoLegs && leg) {
                    // Simular pierna específica
                    const matchData = tournamentData.knockoutRounds[roundIndex].find(m => m.id === matchId);
                    
                    if (leg === 'first') {
                        // Simular primera pierna (ida)
                        const result = simulateTournamentMatch(home, away, finalIsNeutral, homeBonus, awayBonus);
                        matchData.firstLeg.homeGoals = result.homeGoals;
                        matchData.firstLeg.awayGoals = result.awayGoals;
                        matchData.firstLeg.simulated = true;
                        
                        // Actualizar display de la ida
                        document.getElementById(`first-leg-${matchId}`).textContent = `${result.homeGoals}-${result.awayGoals}`;
                        
                        // Habilitar botón de la vuelta
                        document.querySelectorAll(`button[data-match="${matchId}"][data-leg="second"]`).forEach(btn => {
                            btn.disabled = false;
                        });
                        
                        // Actualizar sistema de forma temporalmente
                        updateTeamFormTemp(home, away, result.homeGoals, result.awayGoals);
                        
                    } else if (leg === 'second') {
                        // Simular segunda pierna (vuelta)
                        const result = simulateTournamentMatch(home, away, finalIsNeutral, homeBonus, awayBonus);
                        matchData.secondLeg.homeGoals = result.homeGoals;
                        matchData.secondLeg.awayGoals = result.awayGoals;
                        matchData.secondLeg.simulated = true;
                        
                        // Actualizar display de la vuelta
                        document.getElementById(`second-leg-${matchId}`).textContent = `${result.homeGoals}-${result.awayGoals}`;
                        
                        // Calcular resultado global
                        const totalHome = matchData.firstLeg.awayGoals + result.homeGoals;
                        const totalAway = matchData.firstLeg.homeGoals + result.awayGoals;
                        
                        let winner = null;
                        let resultText = `${totalHome}-${totalAway}`;
                        let extraText = '';
                        
                        if (totalHome > totalAway) {
                            winner = away;
                        } else if (totalAway > totalHome) {
                            winner = home;
                        } else {
                            // Empate en el global
                            if (doubleAwayGoalsCheckbox.checked && !tournamentIsNeutral) {
                                const awayGoalsHomeTeam = result.homeGoals;
                                const awayGoalsAwayTeam = matchData.firstLeg.awayGoals;
                                
                                if (awayGoalsHomeTeam > awayGoalsAwayTeam) {
                                    winner = away;
                                    extraText = ' (goles fuera)';
                                } else if (awayGoalsAwayTeam > awayGoalsHomeTeam) {
                                    winner = home;
                                    extraText = ' (goles fuera)';
                                } else {
                                    const extra = simulateExtraTimeMatchTournament(homeElo, awayElo);
                                    const totalHomeWithExtra = totalHome + extra.home;
                                    const totalAwayWithExtra = totalAway + extra.away;
                                    
                                    if (totalHomeWithExtra > totalAwayWithExtra) {
                                        winner = away;
                                        resultText = `${totalHomeWithExtra}-${totalAwayWithExtra}`;
                                        extraText = ' PRO';
                                    } else if (totalAwayWithExtra > totalHomeWithExtra) {
                                        winner = home;
                                        resultText = `${totalHomeWithExtra}-${totalAwayWithExtra}`;
                                        extraText = ' PRO';
                                    } else {
                                        const penalties = simulatePenaltiesMatchTournament(homeElo, awayElo);
                                        winner = penalties.home > penalties.away ? away : home;
                                        resultText = `${totalHomeWithExtra}-${totalAwayWithExtra}`;
                                        extraText = ` PEN (${penalties.home}-${penalties.away})`;
                                    }
                                }
                            } else {
                                const extra = simulateExtraTimeMatchTournament(homeElo, awayElo);
                                const totalHomeWithExtra = totalHome + extra.home;
                                const totalAwayWithExtra = totalAway + extra.away;
                                
                                if (totalHomeWithExtra > totalAwayWithExtra) {
                                    winner = away;
                                    resultText = `${totalHomeWithExtra}-${totalAwayWithExtra}`;
                                    extraText = ' PRO';
                                } else if (totalAwayWithExtra > totalHomeWithExtra) {
                                    winner = home;
                                    resultText = `${totalHomeWithExtra}-${totalAwayWithExtra}`;
                                    extraText = ' PRO';
                                } else {
                                    const penalties = simulatePenaltiesMatchTournament(homeElo, awayElo);
                                    winner = penalties.home > penalties.away ? away : home;
                                    resultText = `${totalHomeWithExtra}-${totalAwayWithExtra}`;
                                    extraText = ` PEN (${penalties.home}-${penalties.away})`;
                                }
                            }
                        }
                        
                        // Actualizar resultado global
                        document.getElementById(`global-vuelta-${matchId}`).innerHTML = `Global: ${resultText}${extraText}`;
                        
                        // Resaltar equipo clasificado en NEGRITA sin reemplazar nombres
                        const firstLegElement = document.querySelector(`#first-leg-${matchId}`).parentElement;
                        const secondLegElement = document.querySelector(`#second-leg-${matchId}`).parentElement;
                        
                        // Limpiar clases anteriores
                        firstLegElement.querySelectorAll('span').forEach(span => {
                            span.classList.remove('qualified-team');
                            span.innerHTML = span.innerHTML.replace(/<\/?strong>/g, '');
                        });
                        secondLegElement.querySelectorAll('span').forEach(span => {
                            span.classList.remove('qualified-team');
                            span.innerHTML = span.innerHTML.replace(/<\/?strong>/g, '');
                        });
                        
                        // Aplicar negrita al equipo clasificado
                        if (winner === home) {
                            // En la ida: home vs away -> home debe estar en negrita (primer span)
                            const homeSpan = firstLegElement.querySelector('span:first-child');
                            homeSpan.innerHTML = `<strong class="qualified-team">${home}</strong>`;
                            
                            // En la vuelta: away vs home -> home debe estar en negrita (tercer span)
                            const awaySpan = secondLegElement.querySelector('span:nth-child(3)');
                            awaySpan.innerHTML = `<strong class="qualified-team">${home}</strong>`;
                        } else {
                            // En la ida: home vs away -> away debe estar en negrita (tercer span)
                            const awaySpan = firstLegElement.querySelector('span:nth-child(3)');
                            awaySpan.innerHTML = `<strong class="qualified-team">${away}</strong>`;
                            
                            // En la vuelta: away vs home -> away debe estar en negrita (primer span)
                            const homeSpan = secondLegElement.querySelector('span:first-child');
                            homeSpan.innerHTML = `<strong class="qualified-team">${away}</strong>`;
                        }
                        
                        // Guardar resultado
                        matchData.winner = winner;
                        matchData.resultText = resultText + extraText;
                        
                        // Actualizar sistema de forma definitivo
                        updateTeamForm(winner === home ? home : away, 'W');
                        updateTeamForm(winner === home ? away : home, 'L');
                        
                        // Guardar perdedor para partido por el 3er puesto
                        if (roundIndex >= 1) {
                            const loser = matchData.home === winner ? matchData.away : matchData.home;
                            tournamentData.semiFinalLosers.push(loser);
                        }
                    }
                    
                    // Verificar si todos los partidos de esta ronda están completos
                    if (leg === 'second') {
                        const currentRound = tournamentData.knockoutRounds[roundIndex];
                        const allFinished = currentRound.every(m => m.secondLeg.simulated);
                        
                        if (allFinished) {
                            if (roundIndex >= 1 && thirdPlaceCheckbox.checked) {
                                tournamentData.thirdPlaceTeams = tournamentData.semiFinalLosers.slice(-2);
                            }
                            
                            advanceToNextRound(roundIndex);
                        }
                    }
                    
                } else {
                    // Partido único
                    const result = simulateTournamentMatch(home, away, finalIsNeutral, homeBonus, awayBonus);
                    let homeGoals = result.homeGoals;
                    let awayGoals = result.awayGoals;
                    let resultText = `${homeGoals}-${awayGoals}`;
                    let winner = null;
                    
                    if (homeGoals > awayGoals) {
                        winner = home;
                    } else if (awayGoals > homeGoals) {
                        winner = away;
                    } else {
                        // Extra time and penalties
                        const extra = simulateExtraTimeMatchTournament(homeElo, awayElo);
                        const totalHome = homeGoals + extra.home;
                        const totalAway = awayGoals + extra.away;
                        
                        if (totalHome > totalAway) {
                            winner = home;
                            homeGoals = totalHome;
                            awayGoals = totalAway;
                            resultText = `${totalHome}-${totalAway} PRO`;
                        } else if (totalAway > totalHome) {
                            winner = away;
                            homeGoals = totalHome;
                            awayGoals = totalAway;
                            resultText = `${totalHome}-${totalAway} PRO`;
                        } else {
                            const penalties = simulatePenaltiesMatchTournament(homeElo, awayElo);
                            winner = penalties.home > penalties.away ? home : away;
                            resultText = `${totalHome}-${totalAway} PEN (${penalties.home}-${penalties.away})`;
                        }
                    }
                    
                    // Update display
                    document.getElementById(`result-${matchId}`).textContent = resultText;
                    
                    // Store result and advance winner
                    if (!tournamentData.knockoutRounds[roundIndex]) {
                        tournamentData.knockoutRounds[roundIndex] = [];
                    }
                    
                    const match = tournamentData.knockoutRounds[roundIndex].find(m => m.id === matchId);
                    if (match) {
                        match.winner = winner;
                        match.result = resultText;
                        
                        // Actualizar sistema de forma
                        if (winner === home) {
                            updateTeamForm(home, 'W');
                            updateTeamForm(away, 'L');
                        } else {
                            updateTeamForm(away, 'W');
                            updateTeamForm(home, 'L');
                        }
                        
                        // Guardar perdedor para partido por el 3er puesto
                        if (roundIndex >= 1) {
                            const loser = match.home === winner ? match.away : match.home;
                            tournamentData.semiFinalLosers.push(loser);
                        }
                        
                        // Check if all matches in current round are finished
                        const currentRound = tournamentData.knockoutRounds[roundIndex];
                        const allFinished = currentRound.every(m => m.winner);
                        
                        if (allFinished) {
                            if (roundIndex >= 1 && thirdPlaceCheckbox.checked) {
                                tournamentData.thirdPlaceTeams = tournamentData.semiFinalLosers.slice(-2);
                            }
                            
                            advanceToNextRound(roundIndex);
                        }
                    }
                }
            }

            // Actualizar forma temporalmente (para la primera pierna)
            function updateTeamFormTemp(home, away, homeGoals, awayGoals) {
                if (homeGoals > awayGoals) {
                    teamStreaks[home] = teamStreaks[home] || { currentStreak: 0, hasBonus: false };
                    teamStreaks[home].currentStreak = (teamStreaks[home].currentStreak || 0) + 1;
                    
                    teamStreaks[away] = teamStreaks[away] || { currentStreak: 0, hasBonus: false };
                    teamStreaks[away].currentStreak = 0;
                } else if (awayGoals > homeGoals) {
                    teamStreaks[away] = teamStreaks[away] || { currentStreak: 0, hasBonus: false };
                    teamStreaks[away].currentStreak = (teamStreaks[away].currentStreak || 0) + 1;
                    
                    teamStreaks[home] = teamStreaks[home] || { currentStreak: 0, hasBonus: false };
                    teamStreaks[home].currentStreak = 0;
                } else {
                    teamStreaks[home] = teamStreaks[home] || { currentStreak: 0, hasBonus: false };
                    teamStreaks[home].currentStreak = 0;
                    
                    teamStreaks[away] = teamStreaks[away] || { currentStreak: 0, hasBonus: false };
                    teamStreaks[away].currentStreak = 0;
                }
                
                if (teamStreaks[home].currentStreak >= 2) {
                    teamStreaks[home].hasBonus = true;
                } else {
                    teamStreaks[home].hasBonus = false;
                }
                
                if (teamStreaks[away].currentStreak >= 2) {
                    teamStreaks[away].hasBonus = true;
                } else {
                    teamStreaks[away].hasBonus = false;
                }
            }

            // Simulate tournament match con bonus de forma y bonus de goles adicionales
            function simulateTournamentMatch(home, away, isNeutral, homeBonus = 1.0, awayBonus = 1.0) {
                const homeElo = teamData[home];
                const awayElo = teamData[away];
                
                const eloDifference = homeElo - awayElo;
                const homeAdvantage = isNeutral ? 0 : 0.15;
                const eloWeight = 0.028;
                
                const baseHomeGoals = (1.1 + (eloDifference * eloWeight) + homeAdvantage) * homeBonus;
                const baseAwayGoals = (0.9 - (eloDifference * eloWeight)) * awayBonus;
                
                const safeHomeGoals = Math.max(baseHomeGoals, 0.3);
                const safeAwayGoals = Math.max(baseAwayGoals, 0.3);
                
                let homeGoals = poissonRandom(safeHomeGoals);
                let awayGoals = poissonRandom(safeAwayGoals);
                
                const absEloDiff = Math.abs(eloDifference);
                let extraGoalChance = 0;
                let extraTwoGoalsChance = 0;
                
                if (absEloDiff >= 20) {
                    extraGoalChance = 0.60;
                    extraTwoGoalsChance = 0.30;
                } else if (absEloDiff >= 15) {
                    extraGoalChance = 0.30;
                    extraTwoGoalsChance = 0.15;
                } else if (absEloDiff >= 10) {
                    extraGoalChance = 0.20;
                    extraTwoGoalsChance = 0.10;
                } else if (absEloDiff >= 5) {
                    extraGoalChance = 0.10;
                    extraTwoGoalsChance = 0.05;
                }
                
                if (eloDifference > 0) {
                    const rand = Math.random();
                    if (rand < extraTwoGoalsChance) {
                        homeGoals += 2;
                    } else if (rand < extraGoalChance + extraTwoGoalsChance) {
                        homeGoals += 1;
                    }
                } else if (eloDifference < 0) {
                    const rand = Math.random();
                    if (rand < extraTwoGoalsChance) {
                        awayGoals += 2;
                    } else if (rand < extraGoalChance + extraTwoGoalsChance) {
                        awayGoals += 1;
                    }
                }
                
                if (Math.abs(eloDifference) >= 20) {
                    const rand = Math.random();
                    if (homeGoals === awayGoals) {
                        if (eloDifference > 0 && rand < 0.7) {
                            homeGoals += 1;
                        } else if (eloDifference < 0 && rand < 0.7) {
                            awayGoals += 1;
                        }
                    } else if (Math.abs(homeGoals - awayGoals) === 1) {
                        if (rand < 0.1) {
                            if (homeGoals > awayGoals) {
                                awayGoals += 1;
                            } else {
                                homeGoals += 1;
                            }
                        }
                    }
                }
                
                homeGoals = Math.min(homeGoals, 7);
                awayGoals = Math.min(awayGoals, 7);
                
                return { homeGoals, awayGoals };
            }

            // Simulate extra time for tournament
            function simulateExtraTimeMatchTournament(homeElo, awayElo) {
                const eloDifference = homeElo - awayElo;
                const extraTimeBase = 0.25;
                const eloWeight = 0.006;
                
                const extraTimeLambdaHome = Math.max(extraTimeBase + (eloDifference * eloWeight), 0.1);
                const extraTimeLambdaAway = Math.max(extraTimeBase - (eloDifference * eloWeight), 0.1);
                
                const homeGoals = poissonRandom(extraTimeLambdaHome);
                const awayGoals = poissonRandom(extraTimeLambdaAway);
                
                return { home: homeGoals, away: awayGoals };
            }

            // Simulate penalties for tournament
            function simulatePenaltiesMatchTournament(homeElo, awayElo) {
                const eloDifference = homeElo - awayElo;
                const baseProbability = 0.75;
                const eloWeightPenalties = 0.003;
                
                let homePenalties = 0;
                let awayPenalties = 0;
                
                for (let i = 0; i < 5; i++) {
                    const homeProb = Math.max(0.5, Math.min(0.95, baseProbability + (eloDifference * eloWeightPenalties)));
                    const awayProb = Math.max(0.5, Math.min(0.95, baseProbability - (eloDifference * eloWeightPenalties)));
                    
                    if (Math.random() < homeProb) homePenalties++;
                    if (Math.random() < awayProb) awayPenalties++;
                }
                
                while (homePenalties === awayPenalties) {
                    const homeProb = Math.max(0.5, Math.min(0.95, baseProbability + (eloDifference * eloWeightPenalties)));
                    const awayProb = Math.max(0.5, Math.min(0.95, baseProbability - (eloDifference * eloWeightPenalties)));
                    
                    if (Math.random() < homeProb) homePenalties++;
                    if (homePenalties !== awayPenalties) break;
                    if (Math.random() < awayProb) awayPenalties++;
                }
                
                return { home: homePenalties, away: awayPenalties };
            }

            // Advance to next knockout round
            function advanceToNextRound(currentRoundIndex) {
                const currentRound = tournamentData.knockoutRounds[currentRoundIndex];
                const winners = currentRound.map(m => m.winner);
                const nextRoundIndex = currentRoundIndex + 1;
                
                let nextRoundName = '';
                const remainingTeams = winners.length;
                
                if (remainingTeams === 1) {
                    showChampion(winners[0]);
                    
                    if (thirdPlaceCheckbox.checked && tournamentData.thirdPlaceTeams.length === 2) {
                        showThirdPlaceMatch(tournamentData.thirdPlaceTeams[0], tournamentData.thirdPlaceTeams[1]);
                    }
                    
                    return;
                } else if (remainingTeams === 2) {
                    nextRoundName = 'Final';
                    showFinalMatch(winners[0], winners[1]);
                    return;
                } else if (remainingTeams === 4) {
                    nextRoundName = 'Semifinales';
                } else if (remainingTeams === 8) {
                    nextRoundName = 'Cuartos de final';
                } else if (remainingTeams === 16) {
                    nextRoundName = 'Octavos de final';
                } else {
                    nextRoundName = `Ronda de ${remainingTeams} equipos`;
                }
                
                const nextRoundDiv = document.createElement('div');
                nextRoundDiv.className = 'knockout-round';
                nextRoundDiv.innerHTML = `<h3><i class="fas fa-arrow-right"></i> ${nextRoundName}</h3>`;
                
                const isTwoLegs = twoLegsCheckbox.checked;
                
                if (isTwoLegs) {
                    const twoLegsContainer = document.createElement('div');
                    twoLegsContainer.className = 'knockout-two-legs';
                    
                    const firstLegColumn = document.createElement('div');
                    firstLegColumn.className = 'leg-column';
                    firstLegColumn.innerHTML = `<div class="leg-title">Ida</div>`;
                    
                    const secondLegColumn = document.createElement('div');
                    secondLegColumn.className = 'leg-column';
                    secondLegColumn.innerHTML = `<div class="leg-title">Vuelta</div>`;
                    
                    const shuffledWinners = [...winners].sort(() => Math.random() - 0.5);
                    
                    tournamentData.knockoutRounds[nextRoundIndex] = [];
                    
                    for (let i = 0; i < shuffledWinners.length; i += 2) {
                        if (i + 1 < shuffledWinners.length) {
                            const matchId = `ko-${nextRoundIndex}-${i/2}`;
                            const home = shuffledWinners[i];
                            const away = shuffledWinners[i + 1];
                            
                            const firstLegMatch = document.createElement('div');
                            firstLegMatch.className = 'two-leg-match';
                            firstLegMatch.innerHTML = `
                                <div class="match-leg">
                                    <span>${home}</span>
                                    <span class="match-result" id="first-leg-${matchId}">-</span>
                                    <span>${away}</span>
                                    <button class="simulate-match" data-match="${matchId}" data-leg="first" data-home="${home}" data-away="${away}" data-round="${nextRoundIndex}" title="Simular partido de ida">
                                        <i class="fas fa-play"></i> Sim.
                                    </button>
                                </div>
                                <div class="global-result" id="global-${matchId}" style="display: none;">Global: -</div>
                            `;
                            
                            const secondLegMatch = document.createElement('div');
                            secondLegMatch.className = 'two-leg-match';
                            secondLegMatch.innerHTML = `
                                <div class="match-leg">
                                    <span>${away}</span>
                                    <span class="match-result" id="second-leg-${matchId}">-</span>
                                    <span>${home}</span>
                                    <button class="simulate-match" data-match="${matchId}" data-leg="second" data-home="${away}" data-away="${home}" data-round="${nextRoundIndex}" title="Simular partido de vuelta" disabled>
                                        <i class="fas fa-play"></i> Sim.
                                    </button>
                                </div>
                                <div class="global-result" id="global-vuelta-${matchId}">Global: -</div>
                            `;
                            
                            firstLegColumn.appendChild(firstLegMatch);
                            secondLegColumn.appendChild(secondLegMatch);
                            
                            tournamentData.knockoutRounds[nextRoundIndex].push({
                                id: matchId,
                                home: home,
                                away: away,
                                firstLeg: { homeGoals: null, awayGoals: null, simulated: false },
                                secondLeg: { homeGoals: null, awayGoals: null, simulated: false },
                                winner: null,
                                resultText: ''
                            });
                        }
                    }
                    
                    twoLegsContainer.appendChild(firstLegColumn);
                    twoLegsContainer.appendChild(secondLegColumn);
                    nextRoundDiv.appendChild(twoLegsContainer);
                } else {
                    const calendarContainer = document.createElement('div');
                    calendarContainer.className = 'calendar-container';
                    
                    const matchesContainer = document.createElement('div');
                    matchesContainer.className = 'matches-container';
                    
                    const shuffledWinners = [...winners].sort(() => Math.random() - 0.5);
                    
                    tournamentData.knockoutRounds[nextRoundIndex] = [];
                    
                    for (let i = 0; i < shuffledWinners.length; i += 2) {
                        if (i + 1 < shuffledWinners.length) {
                            const matchId = `ko-${nextRoundIndex}-${i/2}`;
                            const matchDiv = document.createElement('div');
                            matchDiv.className = 'match';
                            matchDiv.innerHTML = `
                                <span>${shuffledWinners[i]}</span>
                                <span class="match-result" id="result-${matchId}">-</span>
                                <span>${shuffledWinners[i + 1]}</span>
                                <button class="simulate-match" data-match="${matchId}" data-home="${shuffledWinners[i]}" data-away="${shuffledWinners[i + 1]}" data-round="${nextRoundIndex}" title="Simular partido">
                                    <i class="fas fa-play"></i> Sim.
                                </button>
                            `;
                            matchesContainer.appendChild(matchDiv);
                            
                            tournamentData.knockoutRounds[nextRoundIndex].push({
                                id: matchId,
                                home: shuffledWinners[i],
                                away: shuffledWinners[i + 1],
                                winner: null,
                                result: null
                            });
                        }
                    }
                    
                    calendarContainer.appendChild(matchesContainer);
                    nextRoundDiv.appendChild(calendarContainer);
                }
                
                tournamentContent.appendChild(nextRoundDiv);
                
                document.querySelectorAll(`.simulate-match[data-round="${nextRoundIndex}"]`).forEach(btn => {
                    btn.addEventListener('click', function() {
                        const matchId = this.dataset.match;
                        const home = this.dataset.home;
                        const away = this.dataset.away;
                        const round = parseInt(this.dataset.round);
                        const leg = this.dataset.leg;
                        
                        if (leg === 'second') {
                            const matchData = tournamentData.knockoutRounds[round].find(m => m.id === matchId);
                            if (!matchData.firstLeg.simulated) {
                                alert('Primero debes simular el partido de ida.');
                                return;
                            }
                        }
                        
                        simulateKnockoutMatch(matchId, home, away, round, leg, false);
                        this.disabled = true;
                        this.innerHTML = '<i class="fas fa-check"></i> Sim.';
                    });
                });
                
                setTimeout(() => {
                    nextRoundDiv.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'start' 
                    });
                }, 100);
            }

            // Mostrar partido final
            function showFinalMatch(team1, team2) {
                const finalDiv = document.createElement('div');
                finalDiv.className = 'final-match';
                finalDiv.innerHTML = `
                    <h4><i class="fas fa-trophy"></i> Final</h4>
                    <div class="match">
                        <span>${team1}</span>
                        <span class="match-result" id="result-final">-</span>
                        <span>${team2}</span>
                        <div class="match-buttons">
                            <button class="simulate-match" id="simulate-final" data-home="${team1}" data-away="${team2}" title="Simular partido">
                                <i class="fas fa-play"></i> Sim.
                            </button>
                            <button class="simulate-neutral" id="simulate-final-neutral" data-home="${team1}" data-away="${team2}">
                                (campo neutral)
                            </button>
                        </div>
                    </div>
                `;
                tournamentContent.appendChild(finalDiv);
                
                document.getElementById('simulate-final').addEventListener('click', function() {
                    const home = this.dataset.home;
                    const away = this.dataset.away;
                    simulateFinalMatch(home, away, false);
                    this.disabled = true;
                    this.innerHTML = '<i class="fas fa-check"></i> Sim.';
                    const neutralBtn = document.getElementById('simulate-final-neutral');
                    if (neutralBtn) neutralBtn.style.display = 'none';
                });
                
                document.getElementById('simulate-final-neutral').addEventListener('click', function() {
                    const home = this.dataset.home;
                    const away = this.dataset.away;
                    simulateFinalMatch(home, away, true);
                    const simulateBtn = document.getElementById('simulate-final');
                    if (simulateBtn) simulateBtn.disabled = true;
                    if (simulateBtn) simulateBtn.innerHTML = '<i class="fas fa-check"></i> Sim.';
                    this.style.display = 'none';
                });
            }

            // Simular partido final
            function simulateFinalMatch(home, away, isNeutral = false) {
                const homeElo = teamData[home];
                const awayElo = teamData[away];
                
                const homeBonus = teamStreaks[home]?.hasBonus ? 1.1 : 1.0;
                const awayBonus = teamStreaks[away]?.hasBonus ? 1.1 : 1.0;
                
                const tournamentIsNeutral = tournamentNeutralFieldCheckbox.checked;
                const finalIsNeutral = isNeutral || tournamentIsNeutral;
                
                const result = simulateTournamentMatch(home, away, finalIsNeutral, homeBonus, awayBonus);
                let homeGoals = result.homeGoals;
                let awayGoals = result.awayGoals;
                let resultText = `${homeGoals}-${awayGoals}`;
                let winner = null;
                
                if (homeGoals > awayGoals) {
                    winner = home;
                } else if (awayGoals > homeGoals) {
                    winner = away;
                } else {
                    const extra = simulateExtraTimeMatchTournament(homeElo, awayElo);
                    const totalHome = homeGoals + extra.home;
                    const totalAway = awayGoals + extra.away;
                    
                    if (totalHome > totalAway) {
                        winner = home;
                        homeGoals = totalHome;
                        awayGoals = totalAway;
                        resultText = `${totalHome}-${totalAway} PRO`;
                    } else if (totalAway > totalHome) {
                        winner = away;
                        homeGoals = totalHome;
                        awayGoals = totalAway;
                        resultText = `${totalHome}-${totalAway} PRO`;
                    } else {
                        const penalties = simulatePenaltiesMatchTournament(homeElo, awayElo);
                        winner = penalties.home > penalties.away ? home : away;
                        resultText = `${totalHome}-${totalAway} PEN (${penalties.home}-${penalties.away})`;
                    }
                }
                
                document.getElementById('result-final').textContent = resultText;
                
                showChampion(winner);
            }

            // Mostrar campeón
            function showChampion(champion) {
                const championDiv = document.createElement('div');
                championDiv.className = 'champion';
                championDiv.innerHTML = `
                    <h3><i class="fas fa-crown"></i> ¡Campeón!</h3>
                    <div class="team-name">${champion}</div>
                `;
                tournamentContent.appendChild(championDiv);
            }

            // Mostrar partido por el 3er puesto
            function showThirdPlaceMatch(team1, team2) {
                const thirdPlaceDiv = document.createElement('div');
                thirdPlaceDiv.className = 'third-place-match';
                thirdPlaceDiv.innerHTML = `
                    <h4><i class="fas fa-medal"></i> Partido por el 3er puesto</h4>
                    <div class="match">
                        <span>${team1}</span>
                        <span class="match-result" id="result-third-place">-</span>
                        <span>${team2}</span>
                        <div class="match-buttons">
                            <button class="simulate-match" id="simulate-third-place" data-home="${team1}" data-away="${team2}" title="Simular partido">
                                <i class="fas fa-play"></i> Sim.
                            </button>
                            <button class="simulate-neutral" id="simulate-third-place-neutral" data-home="${team1}" data-away="${team2}">
                                (campo neutral)
                            </button>
                        </div>
                    </div>
                `;
                tournamentContent.appendChild(thirdPlaceDiv);
                
                document.getElementById('simulate-third-place').addEventListener('click', function() {
                    const home = this.dataset.home;
                    const away = this.dataset.away;
                    simulateThirdPlaceMatch(home, away, false);
                    this.disabled = true;
                    this.innerHTML = '<i class="fas fa-check"></i> Sim.';
                    const neutralBtn = document.getElementById('simulate-third-place-neutral');
                    if (neutralBtn) neutralBtn.style.display = 'none';
                });
                
                document.getElementById('simulate-third-place-neutral').addEventListener('click', function() {
                    const home = this.dataset.home;
                    const away = this.dataset.away;
                    simulateThirdPlaceMatch(home, away, true);
                    const simulateBtn = document.getElementById('simulate-third-place');
                    if (simulateBtn) simulateBtn.disabled = true;
                    if (simulateBtn) simulateBtn.innerHTML = '<i class="fas fa-check"></i> Sim.';
                    this.style.display = 'none';
                });
            }

            // Simular partido por el 3er puesto
            function simulateThirdPlaceMatch(home, away, isNeutral = false) {
                const homeElo = teamData[home];
                const awayElo = teamData[away];
                
                const homeBonus = teamStreaks[home]?.hasBonus ? 1.1 : 1.0;
                const awayBonus = teamStreaks[away]?.hasBonus ? 1.1 : 1.0;
                
                const tournamentIsNeutral = tournamentNeutralFieldCheckbox.checked;
                const finalIsNeutral = isNeutral || tournamentIsNeutral;
                
                const result = simulateTournamentMatch(home, away, finalIsNeutral, homeBonus, awayBonus);
                let homeGoals = result.homeGoals;
                let awayGoals = result.awayGoals;
                let resultText = `${homeGoals}-${awayGoals}`;
                let winner = null;
                
                if (homeGoals > awayGoals) {
                    winner = home;
                } else if (awayGoals > homeGoals) {
                    winner = away;
                } else {
                    const penalties = simulatePenaltiesMatchTournament(homeElo, awayElo);
                    winner = penalties.home > penalties.away ? home : away;
                    resultText = `${homeGoals}-${awayGoals} PEN (${penalties.home}-${penalties.away})`;
                }
                
                document.getElementById('result-third-place').textContent = resultText;
                
                const thirdPlaceResult = document.createElement('div');
                thirdPlaceResult.className = 'match-result';
                thirdPlaceResult.style.color = 'var(--warning)';
                thirdPlaceResult.style.fontWeight = 'bold';
                thirdPlaceResult.style.marginTop = '1rem';
                thirdPlaceResult.textContent = `🥉 3er puesto: ${winner}`;
                
                document.querySelector('.third-place-match').appendChild(thirdPlaceResult);
            }

            // Reset tournament
            resetTournamentBtn.addEventListener('click', function() {
                selectedTeams = [];
                tournamentContent.classList.remove('visible');
                tournamentContent.innerHTML = '';
                updateSelectedTeams();
                updateTeamCount();
                updatePopupCounter();
                tournamentData = {
                    groups: [],
                    standings: {},
                    matchResults: {},
                    knockoutRounds: [],
                    semiFinalLosers: [],
                    thirdPlaceTeams: []
                };
                teamForm = {};
                teamStreaks = {};
            });

            // Seleccionar equipos aleatoriamente
            function selectRandomTeams() {
                const format = tournamentFormatSelect.value;
                let requiredTeams;
                
                if (format === 'league') {
                    requiredTeams = 20;
                } else {
                    requiredTeams = {
                        '32_knockout': 32,
                        '16_knockout': 16,
                        '8_knockout': 8,
                        '4_knockout': 4
                    }[format];
                }
                
                const allTeams = Object.keys(teamData);
                
                if (allTeams.length < requiredTeams) {
                    alert(`No hay suficientes equipos en la base de datos. Se necesitan ${requiredTeams} y solo hay ${allTeams.length}.`);
                    return;
                }
                
                const shuffledTeams = [...allTeams].sort(() => Math.random() - 0.5);
                selectedTeams = shuffledTeams.slice(0, requiredTeams);
                
                updateSelectedTeams();
                updateTeamCount();
                updatePopupCounter();
                updateTeamList(teamSearch.value);
                
                alert(`${requiredTeams} equipos seleccionados aleatoriamente.`);
            }

            // Event Listeners
            selectTeamsBtn.addEventListener('click', () => {
                homeTeam = null;
                awayTeam = null;
                homeTeamDisplay.textContent = 'Local';
                awayTeamDisplay.textContent = 'Visitante';
                homeTeamElo.textContent = '-';
                awayTeamElo.textContent = '-';
                document.getElementById('home-team-card').style.borderColor = '';
                document.getElementById('away-team-card').style.borderColor = '';
                openTeamPopup('index');
            });

            selectTournamentTeamsBtn.addEventListener('click', () => openTeamPopup('tournament'));
            
            simulateBtn.addEventListener('click', simulateMatch);
            
            tournamentFormatSelect.addEventListener('change', updateTournamentOptions);
            twoLegsCheckbox.addEventListener('change', updateTournamentOptions);
            
            teamSearch.addEventListener('input', () => updateTeamList(teamSearch.value));
            
            popupClose.addEventListener('click', closeTeamPopup);
            
            popupOkBtn.addEventListener('click', closeTeamPopup);
            
            popupRandomBtn.addEventListener('click', selectRandomTeams);
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && teamPopup.style.display === 'flex') {
                    closeTeamPopup();
                }
            });
            
            teamPopup.addEventListener('click', (e) => {
                if (e.target === teamPopup) {
                    closeTeamPopup();
                }
            });

            // Scroll to top functionality
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    scrollToTopBtn.classList.add('visible');
                } else {
                    scrollToTopBtn.classList.remove('visible');
                }
            });

            scrollToTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            // Initial setup
            updateTournamentOptions();
        });
    </script>
</body>
</html>
